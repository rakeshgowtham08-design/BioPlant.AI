services:
  # Frontend - Static Site (React + Vite)
  - type: web
    name: bioplant-ai-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://bioplant-ai-backend.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://rysmaaqxcwrrthasvcvh.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5c21hYXF4Y3dycnRoYXN2Y3ZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1NTg0NDIsImV4cCI6MjExMDEzNDQ0Mn0.PiH95woLahRgdPG2LSFQLNsdw1k53OlBON4Yg3jFddU

  # Backend - FastAPI Web Service
  - type: web
    name: bioplant-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: SUPABASE_URL
        value: https://rysmaaqxcwrrthasvcvh.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5c21hYXF4Y3dycnRoYXN2Y3ZoIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5NDU1ODQ0MiwiZXhwIjoyMTEwMTM0NDQyfQ.S4S38rBFinoj_qAqQXRTqF0PIgaNjqLFkCeM9sm8Nso
      - key: FRONTEND_URL
        value: https://bioplant-ai-frontend.onrender.com
